project:
  type: website
  output-dir: docs
  resources:
    - "images/**"

website:
  title: ""
  search: false
  
  navbar:
    background: primary
    foreground: light
    logo: images/logos/bibliometrix-logo.png
    logo-alt: "Bibliometrix Logo"
    title: " "
    left:
      - text: "HOME"
        href: home.qmd
      - text: "PROGRAMMA"
        href: programma.qmd
      - text: "ORGANIZZAZIONE"
        href: organizzazione1.qmd
      - text: "VENUE"
        href: venue.qmd
      - text: "REGISTRAZIONE"
        href: registrazione.qmd
      - text: "EDIZIONI PRECEDENTI"
        menu:
          - text: "SSSM 2023 - I Edizione Italiana"
            href: "https://www.bibliometrix.org/home/index.php/school/previous-editions/sssm-2023"
            target: "_blank"
          - text: "SSSM 2024 - II Edizione Italiana"
            href: "https://www.bibliometrix.org/home/index.php/school/previous-editions/sssm"
            target: "_blank"
          - text: "SSSM 2025 - III Edizione Italiana"
            href: "https://www.bibliometrix.org/home/index.php/school/previous-editions/sssm-2025-iii-edizione-italiana"
            target: "_blank"
          - text: "SSSM 2025 - I International Edition"
            href: "https://www.bibliometrix.org/home/index.php/school/previous-editions/sssm-eng-2025"
            target: "_blank"
  
  page-footer:
    left: |
      <img src="images/logos/bibliometrix-logo.png"
           alt="Bibliometrix"
           style="height: 50px; filter: brightness(0) invert(1);">
    center: |
      <div class="footer nav-footer-center">
        © 2025 K-Synth Srl, Academic Spin-Off of the University of Naples Federico II. All Rights Reserved.
      </div>
    right: |
      <div class="footer-socials">
        <a href="mailto:sssm@bibliometrix.com" title="Email"><i class="bi bi-envelope-fill"></i></a>
        <a href="https://x.com/bibliometrix" target="_blank" title="Twitter"><i class="bi bi-twitter-x"></i></a>
        <a href="https://www.instagram.com/bibliometrix/" target="_blank" title="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="https://www.linkedin.com/company/bibliometrix/" target="_blank" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
      </div>

format:
  html:
    theme: 
      - cosmo
      - custom.scss
    css: 
      - styles.css
    toc: false
    toc-depth: 3
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    link-external-icon: false
    code-copy: false
    code-overflow: wrap
    grid:
      sidebar-width: 0px
      body-width: 1200px
      margin-width: 0px
    page-layout: full